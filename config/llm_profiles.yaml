{
  "providers": {
    "openrouter": {
      "base_url_env": "LLM_BASE_URL",
      "base_url_default": "https://api.openai.com/v1",
      "api_key_env": "OPENAI_API_KEY",
      "api_key_fallback_env": "LLM_API_KEY",
      "api_key_fallback_value": "local-config-validation-placeholder"
    }
  },
  "profiles": {
    "article_writer_id": {
      "provider": "openrouter",
      "model_env": "LLM_WRITER_MODEL",
      "fallback_model_env": "LLM_DEFAULT_MODEL",
      "fallback_model_value": "gpt-5.5",
      "temperature": 0.2,
      "top_p": 1.0,
      "max_tokens": 2200,
      "timeout_seconds": 90,
      "max_retries": 1,
      "text_format": "json_schema",
      "supports_json_schema": true,
      "supports_tools": false
    },
    "article_reviewer_id": {
      "provider": "openrouter",
      "model_env": "LLM_REVIEW_MODEL",
      "fallback_model_env": "LLM_DEFAULT_MODEL",
      "fallback_model_value": "gpt-5.5",
      "temperature": 0.1,
      "top_p": 1.0,
      "max_tokens": 1200,
      "timeout_seconds": 60,
      "max_retries": 1,
      "text_format": "json_schema",
      "supports_json_schema": true,
      "supports_tools": false
    },
    "grounding_checker_id": {
      "provider": "openrouter",
      "model_env": "LLM_REVIEW_MODEL",
      "fallback_model_env": "LLM_DEFAULT_MODEL",
      "fallback_model_value": "gpt-5.5",
      "temperature": 0.0,
      "top_p": 1.0,
      "max_tokens": 1000,
      "timeout_seconds": 60,
      "max_retries": 1,
      "text_format": "json_schema",
      "supports_json_schema": true,
      "supports_tools": false
    }
  }
}
